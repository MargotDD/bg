<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc4f5" />
      <stop offset="50%" stop-color="#ffb3dd" />
      <stop offset="100%" stop-color="#fb429c" />
    </linearGradient>
    <linearGradient id="blushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS-style Squircle Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="114" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="6" />

  <!-- Cute Polka Dots on App Icon -->
  <circle cx="80" cy="80" r="10" fill="rgba(255,255,255,0.4)" />
  <circle cx="430" cy="90" r="12" fill="rgba(255,255,255,0.4)" />
  <circle cx="70" cy="430" r="10" fill="rgba(255,255,255,0.4)" />
  <circle cx="430" cy="430" r="14" fill="rgba(255,255,255,0.4)" />

  <!-- Character Group: Smile Girl -->
  <g transform="translate(256, 275)">
    <!-- Back Hair Flow -->
    <path d="M -130 50 C -150 -60, -110 -180, 0 -180 C 110 -180, 150 -60, 130 50 C 110 120, -110 120, -130 50 Z" fill="#756267" />
    
    <!-- Face / Head -->
    <ellipse cx="0" cy="-30" rx="95" ry="92" fill="#FFF2EC" />

    <!-- Cute Neck & Shoulders -->
    <path d="M -30 45 L 30 45 L 45 130 L -45 130 Z" fill="#FFF2EC" />
    <!-- Pink T-shirt -->
    <path d="M -120 160 C -100 80, -50 70, 0 70 C 50 70, 100 80, 120 160 Z" fill="#F472B6" />
    <!-- Cream Overalls -->
    <path d="M -60 100 L 60 100 L 70 160 L -70 160 Z" fill="#FFFFFF" />
    <!-- Overalls Straps -->
    <rect x="-55" y="65" width="22" height="90" rx="6" fill="#FFFFFF" />
    <rect x="33" y="65" width="22" height="90" rx="6" fill="#FFFFFF" />
    <!-- Strap Buttons -->
    <circle cx="-44" cy="115" r="5" fill="#FB7185" />
    <circle cx="44" cy="115" r="5" fill="#FB7185" />

    <!-- Cute Smiling Eyes (Curved happy arcs) -->
    <path d="M -56 -40 Q -40 -56 -24 -40" fill="none" stroke="#4A2E35" stroke-width="6.5" stroke-linecap="round" />
    <path d="M 24 -40 Q 40 -56 56 -40" fill="none" stroke="#4A2E35" stroke-width="6.5" stroke-linecap="round" />

    <!-- Cute Happy Open Mouth -->
    <path d="M -22 -10 Q 0 25 22 -10 Z" fill="#FB7185" stroke="#4A2E35" stroke-width="4" stroke-linejoin="round" />

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="-60" cy="-22" rx="18" ry="12" fill="#FFAEC9" opacity="0.85" />
    <ellipse cx="60" cy="-22" rx="18" ry="12" fill="#FFAEC9" opacity="0.85" />

    <!-- Front Bangs / Hair -->
    <path d="M -90 -45 C -75 -130, 75 -130, 90 -45 C 80 -80, 50 -100, 25 -70 C 10 -90, -20 -90, -35 -70 C -55 -100, -80 -75, -90 -45 Z" fill="#756267" />
    <!-- Adorable Hair Flyaways on Top -->
    <path d="M -25 -155 Q -40 -195 -10 -175" fill="none" stroke="#756267" stroke-width="7" stroke-linecap="round" />
    <path d="M 15 -155 Q 45 -190 20 -170" fill="none" stroke="#756267" stroke-width="6" stroke-linecap="round" />

    <!-- Cute Sparkle & Heart Floating -->
    <path d="M 90 -120 Q 110 -120 110 -140 Q 110 -120 130 -120 Q 110 -120 110 -100 Q 110 -120 90 -120 Z" fill="#FFFFFF" />
    <path d="M -110 -105 C -120 -115, -135 -110, -135 -95 C -135 -80, -110 -65, -110 -65 C -110 -65, -85 -80, -85 -95 C -85 -110, -100 -115, -110 -105 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
